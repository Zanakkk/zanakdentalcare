<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
/* Instagram covers ~250px top and ~340px bottom in stories: keep key text out of those zones */
.canvas { background: var(--navy-deep); color: #fff; }
.brand { position: absolute; left: 80px; top: 260px; }
.text { position: absolute; left: 80px; right: 80px; top: 390px; }
.kicker { font-weight: 700; font-size: 26px; letter-spacing: .16em; text-transform: uppercase; opacity: .6; margin-bottom: 26px; }
.hl { font-size: 150px; color: #fff; }
.mark { color: var(--navy-deep); display: inline-block; margin-top: 14px; }
.mark::before { top: 0.02em; bottom: -0.06em; height: auto; left: -0.08em; right: -0.1em; }
.circle { position: absolute; left: 50%; top: 1060px; width: 760px; height: 760px; margin-left: -380px; border-radius: 50%; background: var(--navy); }
.doc { position: absolute; left: 50%; top: 940px; height: 1040px; transform: translateX(-46%); }
.chips { position: absolute; left: 80px; right: 80px; top: 1250px; display: flex; justify-content: space-between; }
.chip { background: #fff; color: var(--ink); border-radius: 18px; padding: 18px 24px; box-shadow: 0 14px 40px rgba(0,0,0,.25); }
.chip small { display: block; font-size: 18px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #5A6684; margin-bottom: 4px; }
.chip b { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; color: var(--navy); }
.cta { position: absolute; left: 80px; right: 80px; top: 1480px; background: #fff; color: var(--ink); border-radius: 26px; padding: 26px 30px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 18px 50px rgba(0,0,0,.3); }
.cta .num { color: var(--ink); font-size: 46px; }
.cta .lbl { color: #5A6684; opacity: 1; }
.arrow { font-size: 22px; font-weight: 700; color: var(--navy); text-align: right; line-height: 1.35; }
</style></head><body>
<div class="canvas story">
  <div class="brand light"><img src="logo-white.png"><div class="name">Zanak Dental Care<small>Klinik Gigi Payakumbuh</small></div></div>

  <div class="text">
    <div class="kicker">Behel / Ortodonti</div>
    <div class="hl">Konsultasi<br>behel<br><span class="mark">gratis.</span></div>
  </div>

  <div class="circle"></div>
  <img class="doc" src="doctor.png">

  <div class="chips">
    <div class="chip"><small>Lokasi</small><b>Kaniang Bukik</b></div>
    <div class="chip"><small>Pembayaran</small><b>Bisa DP</b></div>
  </div>

  <div class="cta">
    <div class="wa"><div class="ico"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2.2a9.7 9.7 0 0 0-8.4 14.6L2.3 21.8l5.1-1.3A9.7 9.7 0 1 0 12 2.2Zm5.6 13.7c-.2.7-1.4 1.3-2 1.4-.5.1-1.2.1-1.9-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5-4.5-.2-.2-1.2-1.6-1.2-3s.7-2.2 1-2.5c.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.2.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.4Z"/></svg></div>
      <div><div class="lbl">Chat WhatsApp</div><div class="num">0895 2669 7902</div></div></div>
    <div class="arrow">Sen–Sab<br>10.00–21.00</div>
  </div>
</div>
</body></html>
